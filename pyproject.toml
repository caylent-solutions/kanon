[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanon-cli"
version = "3.3.3"
description = "Kanon (Kanon Package Manager) CLI tool"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

authors = [
  { name = "Caylent", email = "solutions-owners@caylent.com" }
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]

dependencies = [
    "defusedxml>=0.7.1",
    "packaging>=23.0",
    # Exact-pinned: shtab's generated output is compared byte-for-byte against
    # committed golden fixtures (tests/fixtures/completion/); any newer shtab
    # release can change that output and break the fixture comparison.
    "shtab==1.8.0",
]

[project.scripts]
kanon = "kanon_cli.cli:main"

[project.urls]
Homepage = "https://github.com/caylent-solutions/kanon"
Issues = "https://github.com/caylent-solutions/kanon/issues"







[tool.hatch.build.targets.wheel]
packages = [
    "src/kanon_cli",
]
include = [
    "repo",
    "git_ssh",
    "hooks/*",
    "requirements.jsonc",
]


[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["tests/fixtures", "tests/unit/repo/fixtures", ".devcontainer"]

[tool.ruff.lint]
select = ["F", "E"]
ignore = ["E731", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--ignore=tests/unit/repo/test_harness_smoke.py"
# Per-test deadline (pytest-timeout). The number of seconds comes from
# KANON_TEST_TIMEOUT via PYTEST_TIMEOUT, which tests/conftest.py exports before
# pytest-timeout configures itself; only the method is fixed here. "thread" is used
# rather than "signal" because the hang this guards against parks the main thread in
# waitpid() around a deadlocked repo-sync pool, and the thread method both fires
# unconditionally and dumps every thread's stack, which is the diagnostic that
# identifies such a hang.
timeout_method = "thread"
markers = [
    "unit: Unit tests -- fast, isolated, no external dependencies",
    "functional: Functional tests -- exercise CLI via subprocess",
    "integration: Integration tests -- verify modules load and run end-to-end",
    "scenario: End-to-end scenario tests mirroring docs/integration-testing.md",
]


[tool.coverage.run]
source = ["src/kanon_cli"]
data_file = ".coverage-data/.coverage"
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
show_missing = true


[tool.semantic_release]
version_variable = "src/kanon_cli/__init__.py:__version__"
version_toml = ["pyproject.toml:project.version"]
build_command = "python -m build"
tag_format = "{version}"
major_on_zero = true
branch = "main"
upload_to_pypi = false
upload_to_release = false
commit_version_number = true

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
changelog_scope = false
exclude_commit_patterns = []

[tool.semantic_release.commit_parser_options]
allowed_tags = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "revert",
  "security",
  "style",
  "test"
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "security", "revert"]




[tool.mypy]
exclude = ["src/kanon_cli/repo/"]

[tool.pymarkdown.plugins.md013]
enabled = false

[tool.pymarkdown.plugins.md024]
siblings_only = true




# The single declaration of the development toolchain. Every `make` target
# invokes these through `uv run`, so they resolve from uv.lock rather than from
# whatever happens to be on PATH. This list previously coexisted with a
# requirements-dev.txt installed by pip; the two disagreed (pytest 8.3 vs 9.0,
# and ruff/bandit/twine/semantic-release were absent here), so CI ran the same
# suite under two different toolchains and only one of them honoured uv.lock.
#
# `ruff` is exact-range pinned for the same reason `shtab` is: `ruff format
# --check` is a byte-level gate and the tree is formatted with 0.11.x. A newer
# ruff can reformat and fail the gate without any source change.
[dependency-groups]
dev = [
    "bandit~=1.9.0",
    "build>=1.4.3",
    "hatchling>=1.29.0",
    "mypy>=1.0.0",
    "pre-commit>=4.0.0",
    "pymarkdownlnt>=0.9.38",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
    "python-semantic-release~=8.0.0",
    "ruff~=0.11.0",
    "twine~=6.1.0",
    "types-defusedxml>=0.7.0",
    "yamllint>=1.38.0",
]

# Markdown lint configuration consumed by `make lint-markdown` (pymarkdownlnt).
# Mirrors the committed .markdownlint.json posture so the two linters agree:
#   MD013 (line-length) is not enforced; MD024 (duplicate headings) is
#   restricted to sibling headings only. No other rule is disabled.
